<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" />
    <title>Test Zentek</title>
    <meta name="description" content="React Application" />
    <script>
      // Handling GitHub Pages path issues with React Router
      (function() {
        // Don't run this in development
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return;
        
        const { pathname } = window.location;
        // Check if we need to redirect to the base path
        if (pathname.indexOf('/TestZentek/') !== 0 && pathname !== '/TestZentek') {
          window.location.href = '/TestZentek/';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./assets/entry.client-GYH6YEgi.js"></script>
  </body>
</html>
