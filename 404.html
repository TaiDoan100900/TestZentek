<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // MIT License
    // This script takes the current URL and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new URL with only a query string and hash fragment
    
    // Parse the URL
    var pathSegmentsToKeep = 1; // Change to match your repo name structure
    var l = window.location;
    var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
    redirectUrl += '/TestZentek/';
    
    var path = l.pathname.split('/');
    path.length > 0 ? path.splice(0, pathSegmentsToKeep + 1) : path = [];
    
    // If there's a path left after removing segments, add it to the redirectUrl
    if (path.length > 0) {
      redirectUrl += path.join('/');
    }
    
    // Add query string and hash
    redirectUrl += l.search + l.hash;
    
    // Redirect to the new URL
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>If you are not redirected automatically, follow this <a href="/TestZentek/">link</a>.</p>
</body>
</html>
